# Server Configuration
server.port=8080

# Application Name
spring.application.name=matchmind-backend

# Dataset Configuration
dataset.path=../dataset

# Gemini configuration. Keep the API key in the backend environment only.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

# AI Mode: GEMINI or DEMO
ai.mode=${AI_MODE:DEMO}

# CORS Configuration
cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
